<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div style="height: 100vh;" class="p-5 d-flex align-items-center justify-content-center">

        <div class="row w-100 align-items-center border rounded shadow ">
            <div class="col-lg-6 ">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-KDUzaqlzW8NSrXxfaDMreW2_x9LohNLI2w&s"
                    alt="" class="w-100">
            </div>
            <div class="col-lg-6">
                <h1 class="text-primary">SignIn</h1>
                <p>Login into Employee Portal

                </p>
                <form>
                    <input id="inputname" type="text" class="form-control my-3" placeholder="enter username">
                    <input id="inputpswd" type="password" class="form-control my-3" placeholder="enter password">
                    <button type="button" onclick="login()" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</body>
<script>
const login=()=>{
    let name=document.getElementById('inputname').value
    let pswd=document.getElementById('inputpswd').value
    if(name&&pswd){
        window.location="dash.html"
        sessionStorage.setItem("uname",name)
        sessionStorage.setItem("upswd",pswd)

    }
    else{
        alert("enter username and password")
    }

}


</script>

</html>
