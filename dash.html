<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div style="height: 100vh;">

        <nav class="navbar bg-secondary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQr2emeWFijoIbBiVeVx3gNpePO9mAYxdWbmg&s"
                        alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                    Employee Portal
                </a>
                <button onclick="logout()" class="btn btn-dark ">Logout</button>
            </div>
        </nav>
        <h2 class="mt-3">Hi! Welcome <span class="text-danger" id="output"></span></h2>
    </div>
</body>
<script>
    if (sessionStorage.getItem("uname")) {
        let out = document.getElementById("output")

        out.innerHTML = sessionStorage.getItem("uname")
    }
    else {
        alert("please login")
        window.location = "login.html"
    }

    const logout = () => {
        sessionStorage.clear()
        window.location = "login.html"
    }
</script>

</html>
